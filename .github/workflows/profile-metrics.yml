name: Actualizar estadísticas del perfil

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar métricas (incluye repos privados)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          user: elguerrerojohn
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_ignored: html, css, scss, markdown, json, yaml
          config_timezone: America/Bogota
          output: metrics.svg
          committer: yes
          committer_token: ${{ secrets.GH_PAT }}

      - name: Insertar métricas en README
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          block = (
              '<p align="center">\n'
              '  <img src="./metrics.svg" alt="Métricas actualizadas automáticamente"/>\n'
              '</p>'
          )

          start = content.index("<!-- METRICS:START -->")
          end = content.index("<!-- METRICS:END -->")
          content = (
              content[: start + len("<!-- METRICS:START -->\n")]
              + block
              + "\n"
              + content[end:]
          )
          readme.write_text(content, encoding="utf-8")
          PY

      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md metrics.svg
          if git diff --staged --quiet; then
            echo "Sin cambios para publicar."
          else
            git commit -m "chore: actualizar métricas del perfil"
            git push
          fi
